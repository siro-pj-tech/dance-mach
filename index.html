<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#25113f"><title>DANCE MATCH! | SARUMAN GAMES</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><div class="spotlights" aria-hidden="true"><i class="spot red"></i><i class="spot blue"></i><i class="spot yellow"></i><i class="spot green"></i></div><header><span class="brand">SARUMAN<br>GAMES</span><div class="metric"><small>SCORE</small><strong id="score">000000</strong></div><div class="metric right"><small>HIGH SCORE</small><strong id="high">000000</strong></div></header>
<section id="title" class="screen title"><p class="eyebrow">LET'S DANCE TOGETHER!</p><h1>DANCE<br><em>MATCH!</em></h1><p class="intro">シルエットと同じポーズを見つけよう！</p><div id="modePicker" class="mode-picker" hidden><span>MODE</span><button id="normalMode" type="button" aria-pressed="true">NORMAL</button><button id="hyperMode" type="button" aria-pressed="false">HYPER</button></div><p id="unlockHint" class="unlock-hint">3曲を最後まで遊ぶと HYPER MODE が解放！</p><div class="selection"><label for="track">MUSIC SELECT</label><select id="track"></select><button id="preview" class="preview-button" type="button">▶ この曲を試聴</button><div class="volume-controls"><label for="bgmVolume">BGM音量 <output id="bgmValue">100%</output></label><input id="bgmVolume" type="range" min="0" max="100" value="100" aria-label="BGM音量"><label for="seVolume">SE音量 <output id="seValue">50%</output></label><input id="seVolume" type="range" min="0" max="100" value="50" aria-label="SE音量"></div><div class="track-detail"><span id="bpm"></span><span>BEST <b id="best">000000</b></span></div><p id="previewHint">曲を選ぶと試聴できます</p></div><button class="primary" id="start">Dancing Time! <span>▶</span></button><p class="tip">3枚のカードから選ぼう！<br>ランプが消えるまで選び直せるよ</p></section>
<section id="game" class="screen" hidden><div class="game-top"><span id="songName"></span><span id="question">READY?</span></div><div class="stage" id="stage"><div class="bg" id="background"></div><div class="dancer" id="dancer"></div><img class="figure" id="bow" src="assets/image/saruman_bow.png" alt=""><img class="curtain" id="curtain" src="assets/image/bg_curtain.png" alt=""><img class="figure" id="reveal" alt=""><img class="figure silhouette" id="silhouette" alt=""><div id="verdict" class="verdict"></div></div><div id="lamps" class="lamps" aria-label="残り時間"></div><div id="cards" class="cards"></div><p class="status" id="status">さあ、ダンスの時間！</p><button id="retryAudio" class="secondary retry-audio" type="button" hidden>音楽を再生する</button><div class="combo" id="combo"></div></section>
<section id="result" class="screen result" hidden><p class="eyebrow">THANK YOU FOR DANCING!</p><h2>DANCE<br><em>FINISHED!</em></h2><div class="finish-wrap"><img class="finish" src="assets/image/saruman_finish.jpg" alt="決めポーズのサルマン"><div id="unlockBanner" class="unlock-banner" role="status" hidden>ハイパーモード解禁！</div></div><p id="resultSong"></p><div class="result-score"><small>YOUR SCORE</small><strong id="resultScore"></strong><span id="newRecord"></span></div><div class="stats"><div><small>正解率</small><strong id="accuracy"></strong></div><div><small>MAX COMBO</small><strong id="maxCombo"></strong></div><div><small>BEST SCORE</small><strong id="resultBest"></strong></div></div><button id="replay" class="primary">もう一度踊る！ <span>▶</span></button><button id="choose" class="secondary">別の曲を選ぶ</button></section><div id="notice" role="status"></div></main><script src="game.js"></script></body></html>
